<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadtrip Planner</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="map"></div>

  <div id="control-panel" class="glass-panel">
    <label for="from-input">From</label>
    <input type="text" id="from-input" placeholder="Starting point">
    <label for="to-input">To</label>
    <input type="text" id="to-input" placeholder="Destination">
    <div class="hours-row">
      <label for="hours-slider">Hours available</label>
      <input type="range" id="hours-slider" min="1" max="12" value="4">
      <span id="hours-label">4 h</span>
    </div>
    <button id="plan-btn">Plan trip</button>
  </div>

  <aside id="itinerary" hidden></aside>
</body>
</html>
